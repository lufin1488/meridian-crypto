<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AERO — 3D демо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A1330;
    --accent:#FF5A3C;
    --sky1:#EAF2FF;
    --sky2:#BFD8FF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    font-family:'Space Grotesk', system-ui, sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 100%);
  }
  #scene{ position:fixed; inset:0; display:block; }

  .overlay{ position:fixed; inset:0; pointer-events:none; padding:34px 40px; display:flex; flex-direction:column; justify-content:space-between; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; }
  .brand{ font-size:24px; font-weight:700; letter-spacing:0.06em; }
  .brand span{ color:var(--accent); }
  .brand small{ display:block; font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.22em; opacity:0.55; font-weight:400; margin-top:4px; }
  .nav{ display:flex; gap:26px; font-size:13px; font-weight:500; opacity:0.7; }

  .hero{ max-width:520px; }
  .hero .kicker{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.24em; color:var(--accent); font-weight:500; margin-bottom:14px; }
  .hero h1{ font-size:clamp(34px, 5vw, 58px); line-height:1.02; font-weight:700; letter-spacing:-0.01em; }
  .hero p{ font-size:15px; line-height:1.6; margin-top:16px; max-width:400px; opacity:0.7; }
  .cta{ pointer-events:auto; margin-top:26px; display:inline-flex; align-items:center; gap:10px; background:var(--accent); color:#fff; border:none; padding:14px 26px; border-radius:40px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; box-shadow:0 12px 30px rgba(255,90,60,0.3); transition:transform .15s, box-shadow .15s; }
  .cta:hover{ transform:translateY(-2px); box-shadow:0 16px 38px rgba(255,90,60,0.4); }

  .bottombar{ display:flex; justify-content:space-between; align-items:flex-end; }
  .hint{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.06em; opacity:0.5; display:flex; align-items:center; gap:9px; }
  .hint .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); animation:blink 1.6s ease-in-out infinite; }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }
  .stats{ display:flex; gap:34px; text-align:right; }
  .stat b{ display:block; font-size:22px; font-weight:700; }
  .stat span{ font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.12em; opacity:0.55; }

  .loader{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--sky1); z-index:10; font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.2em; color:var(--accent); transition:opacity .6s; }
  .loader.hide{ opacity:0; pointer-events:none; }

  @media (max-width:720px){
    .overlay{ padding:22px; }
    .nav{ display:none; }
    .stats{ gap:18px; }
    .stat b{ font-size:17px; }
  }
</style>
</head>
<body>
<div class="loader" id="loader">ЗАГРУЗКА СЦЕНЫ…</div>
<canvas id="scene"></canvas>

<div class="overlay">
  <div class="topbar">
    <div class="brand">AERO<span>·</span>3D<small>FLIGHT DEMO</small></div>
    <nav class="nav">
      <span>Направления</span><span>Как это работает</span><span>Цены</span><span>О нас</span>
    </nav>
  </div>

  <div class="hero">
    <div class="kicker">ИНТЕРАКТИВНАЯ 3D-СЦЕНА</div>
    <h1>Весь мир — в одном клике от тебя</h1>
    <p>Крути самолёт мышью, разгляди с любой стороны. Так может выглядеть главная страница трэвел-сервиса.</p>
    <button class="cta">Найти билеты →</button>
  </div>

  <div class="bottombar">
    <div class="hint"><span class="dot"></span>ЗАЖМИ И КРУТИ · КОЛЁСИКО — ЗУМ</div>
    <div class="stats">
      <div class="stat"><b>1200+</b><span>НАПРАВЛЕНИЙ</span></div>
      <div class="stat"><b>60 FPS</b><span>РЕАЛ-ТАЙМ</span></div>
    </div>
  </div>
</div>

<script>
  window.__err = null;
  window.addEventListener('error', e => { window.__err = (e.message || '') + ' @ ' + (e.filename||'') + ':' + (e.lineno||''); });
  window.addEventListener('unhandledrejection', e => { window.__err = 'PROMISE: ' + (e.reason && e.reason.message || e.reason); });
</script>
<script type="module">
window.__moduleStarted = true;
import * as THREE from './vendor/three/three.module.js';
import { OrbitControls } from './vendor/three/OrbitControls.js';
window.__importsOk = true;

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdbe8ff);
scene.fog = new THREE.Fog(0xdbe8ff, 22, 55);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(7, 3.5, 11);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 6;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.85;
controls.target.set(0, 0.3, 0);
// пользователь взаимодействует → выключаем авто-вращение
controls.addEventListener('start', () => { controls.autoRotate = false; });

// ---------- освещение ----------
const hemi = new THREE.HemisphereLight(0xffffff, 0x9fb8e6, 0.9);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(8, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 40;
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
sun.shadow.bias = -0.0004;
scene.add(sun);

const rim = new THREE.DirectionalLight(0xff8a6b, 0.6);
rim.position.set(-9, 4, -7);
scene.add(rim);

// ---------- материалы ----------
const bodyMat  = new THREE.MeshStandardMaterial({ color:0xf4f7fc, metalness:0.35, roughness:0.35 });
const accentMat= new THREE.MeshStandardMaterial({ color:0xff5a3c, metalness:0.3, roughness:0.35 });
const darkMat  = new THREE.MeshStandardMaterial({ color:0x18305c, metalness:0.4, roughness:0.4 });
const glassMat = new THREE.MeshStandardMaterial({ color:0x0a1330, metalness:0.6, roughness:0.15 });
const engineMat= new THREE.MeshStandardMaterial({ color:0xd7deea, metalness:0.6, roughness:0.3 });

// ---------- самолёт ----------
const plane = new THREE.Group();

// фюзеляж
const fuselage = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 8, 40), bodyMat);
fuselage.rotation.z = Math.PI/2;
fuselage.castShadow = true;
plane.add(fuselage);

// нос
const nose = new THREE.Mesh(new THREE.SphereGeometry(0.85, 40, 24, 0, Math.PI*2, 0, Math.PI/2), bodyMat);
nose.rotation.z = -Math.PI/2;
nose.position.x = 4;
nose.scale.set(1, 1.4, 1);
nose.castShadow = true;
plane.add(nose);

// хвостовой конус
const tailCone = new THREE.Mesh(new THREE.ConeGeometry(0.85, 2, 40), bodyMat);
tailCone.rotation.z = Math.PI/2;
tailCone.position.x = -5;
tailCone.castShadow = true;
plane.add(tailCone);

// кабина (стекло)
const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.6, 24, 16, 0, Math.PI*2, 0, Math.PI/2), glassMat);
cockpit.rotation.z = -Math.PI/2.4;
cockpit.position.set(3.4, 0.35, 0);
cockpit.scale.set(1, 1, 1.1);
plane.add(cockpit);

// цветная полоса по борту
const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.862, 0.862, 8, 40, 1, true, 0, 0.5), accentMat);
stripe.rotation.z = Math.PI/2;
stripe.position.y = 0.15;
plane.add(stripe);

// иллюминаторы
const windowGeo = new THREE.CircleGeometry(0.08, 12);
for(let i=0; i<11; i++){
  const w = new THREE.Mesh(windowGeo, glassMat);
  w.position.set(-3.2 + i*0.62, 0.32, 0.855);
  w.rotation.x = 0; w.rotation.y = 0;
  w.lookAt(w.position.x, w.position.y, 5);
  plane.add(w);
}

// крылья
const wingShape = new THREE.BoxGeometry(2.4, 0.12, 7.5);
function makeWing(dir){
  const wing = new THREE.Mesh(wingShape, bodyMat);
  wing.castShadow = true;
  wing.position.set(-0.3, -0.15, 0);
  wing.geometry = new THREE.BoxGeometry(2.6, 0.12, 6.8);
  const g = new THREE.Group();
  g.add(wing);
  // законцовка (winglet)
  const tip = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 0.12), accentMat);
  tip.position.set(-0.9, 0.3, dir*3.4);
  tip.rotation.x = dir*0.4;
  g.add(tip);
  g.rotation.y = dir*0.12;
  g.position.z = dir*0.4;
  g.scale.z = 0.55;
  return g;
}
// одно цельное крыло сквозь корпус
const mainWing = new THREE.Mesh(new THREE.BoxGeometry(2.7, 0.14, 11), bodyMat);
mainWing.castShadow = true;
mainWing.position.set(-0.3, -0.2, 0);
plane.add(mainWing);
// законцовки
[-1,1].forEach(d=>{
  const tip = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.75, 0.16), accentMat);
  tip.position.set(-0.9, 0.28, d*5.5);
  tip.rotation.x = d*0.45;
  tip.castShadow = true;
  plane.add(tip);
});

// двигатели под крыльями
[-1,1].forEach(d=>{
  const eng = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 1.5, 24), engineMat);
  eng.rotation.z = Math.PI/2;
  eng.position.set(-0.1, -0.7, d*3);
  eng.castShadow = true;
  plane.add(eng);
  const intake = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.08, 12, 24), darkMat);
  intake.position.set(0.65, -0.7, d*3);
  intake.rotation.y = Math.PI/2;
  plane.add(intake);
  const fan = new THREE.Mesh(new THREE.CircleGeometry(0.34, 20), darkMat);
  fan.position.set(0.66, -0.7, d*3);
  fan.rotation.y = -Math.PI/2;
  plane.add(fan);
});

// хвостовое оперение — вертикальный киль
const fin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2, 0.14), accentMat);
fin.position.set(-4.5, 1.1, 0);
fin.rotation.z = 0.35;
fin.castShadow = true;
plane.add(fin);
// горизонтальные стабилизаторы
const stab = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.12, 4), bodyMat);
stab.position.set(-4.6, 0.2, 0);
stab.castShadow = true;
plane.add(stab);

plane.position.y = 0.4;
plane.rotation.y = -0.35;
scene.add(plane);

// ---------- облака ----------
const cloudMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:1, metalness:0, transparent:true, opacity:0.9 });
const clouds = [];
function makeCloud(x,y,z,s){
  const c = new THREE.Group();
  const n = 4 + Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){
    const puff = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), cloudMat);
    puff.position.set((Math.random()-0.5)*3, (Math.random()-0.5)*0.8, (Math.random()-0.5)*2);
    puff.scale.setScalar(0.7 + Math.random()*0.8);
    c.add(puff);
  }
  c.position.set(x,y,z);
  c.scale.setScalar(s);
  scene.add(c);
  clouds.push({ mesh:c, speed:0.2+Math.random()*0.4 });
}
makeCloud(-14, -3, -6, 1.2);
makeCloud(13, 4, -10, 1.6);
makeCloud(-10, 5, -12, 1.3);
makeCloud(16, -4, 4, 1.1);
makeCloud(-16, 2, 8, 1.4);

// мягкая тень на «земле» (невидимая плоскость, ловит только тень)
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity:0.18 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -4;
ground.receiveShadow = true;
scene.add(ground);

// ---------- анимация ----------
const clock = new THREE.Clock();
function animate(){
  const t = clock.getElapsedTime();
  // лёгкое «парение» самолёта
  plane.position.y = 0.4 + Math.sin(t*1.1)*0.12;
  plane.rotation.z = Math.sin(t*0.7)*0.03;
  // движение облаков
  clouds.forEach(c=>{
    c.mesh.position.x += c.speed * 0.01;
    if(c.mesh.position.x > 20) c.mesh.position.x = -20;
  });
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

// прячем лоадер после первого кадра
requestAnimationFrame(()=>{ document.getElementById('loader').classList.add('hide'); });

// временный хук для проверки рендера в headless-панели
window.__app = { THREE, renderer, scene, camera, plane, controls };

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
